# ☁️ Cloudflare Worker config — APEX hub
# ⚠️ Project ka naam WAAHI hona chahiye jo already deploy hai, warna naya worker ban jaayega.
name = "apex-humanoid-v2"
main = "worker.js"
compatibility_date = "2025-01-01"

# 🌙 Night shift — har 10 minute me comment patrol + brain KV copy zinda rehta hai
[triggers]
crons = ["*/10 * * * *"]

# 🔑 KV namespace — 24 Oct 8:41 pm aapne banaya (APEX_KV), id neeche bhar di gayi hai.
#    Naya banane ki zaroorat nahi. Dashboard me binding ka Variable name APEX_KV (ya KV_BINDING) rakhein.
[[kv_namespaces]]
binding = "APEX_KV"
id = "e31bee0bb26c4fcc90154f80e1ba78da"

# 📦 Static assets — jo worker / par app serve karta hai.
#    Ye line TABHI rakhein jab aap DEPLOY-NOW.sh use kar rahe ho (wo ../dist ko ./site me copy karta hai).
#    Dashboard se sirf code paste kar rahe ho toh ye block hata dena (assets wahan se configured rehte hain).
[assets]
directory = "./site"

# 📝 Secrets (ek-ek karke daalein, file me kabhi mat likhein):
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_OWNER_ID
#   npx wrangler secret put COINDCX_API_KEY
#   npx wrangler secret put COINDCX_API_SECRET
#   npx wrangler secret put IG_GRAPH_TOKEN            # optional (app me daalna behtar)
#   npx wrangler secret put YOUTUBE_REFRESH_TOKEN     # abhi worker par NAHI hai (health me youtubeUploadAuth:false)
#   npx wrangler secret put APEX_BRAIN_KEY            # optional — brain KV lock

# 🪣 R2 public asset proxy (optional, ₹0): /asset/<key> → R2 object
# Secrets (CLI se daalo, repo me mat likho):
#   npx wrangler secret put R2_ACCESS_KEY_ID
#   npx wrangler secret put R2_SECRET_ACCESS_KEY
#   npx wrangler secret put R2_BUCKET          # e.g. apex
#   npx wrangler secret put R2_ACCOUNT_HOST    # 94ea16…c0f9.r2.cloudflarestorage.com
#   (optional) npx wrangler secret put R2_ENDPOINT  # endpoint ka scheme-less host bhi chalega
