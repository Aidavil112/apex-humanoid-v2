name: Deploy to Render

# Kicks Render's deploy hook after CI passes on main.
# Setup:
#   1. Render dashboard → your service → Settings → Deploy Hook → copy URL
#   2. GitHub repo → Settings → Secrets and variables → Actions → New secret
#      Name: RENDER_DEPLOY_HOOK_URL   Value: https://api.render.com/deploy/srv-...
#   3. (optional) Repo → Settings → Environments → "production" for approval gates

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    environment: production

    steps:
      - name: Guard — secret present?
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret not set — skipping deploy."
            echo "skip=1" >> "$GITHUB_ENV"
          fi

      - name: Trigger deploy hook
        if: env.skip != '1'
        run: |
          code=$(curl -sS -o /tmp/render.out -w '%{http_code}' -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render responded with HTTP $code"
          cat /tmp/render.out || true
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Summary
        run: |
          echo "### Render deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
