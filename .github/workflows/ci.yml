name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # 1. Typecheck + production build + smoke test against /health
  # ---------------------------------------------------------------------
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Smoke test the server
        env:
          NODE_ENV: production
          PORT: '3000'
        run: |
          npx tsx server.ts & echo $! > /tmp/apex.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /tmp/health.json; then break; fi
            sleep 1
          done
          echo "--- /health ---"; cat /tmp/health.json
          curl -sf http://127.0.0.1:3000/ | grep -qi "apex" && echo "✔ index.html served"
          kill "$(cat /tmp/apex.pid)" || true

      - name: Report build size
        if: always()
        run: du -sh dist 2>/dev/null || true

  # ---------------------------------------------------------------------
  # 2. Validate the Dockerfile builds (no push — just proof it works)
  # ---------------------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (cache enabled)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: apex-humanoid:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot container & hit /health
        run: |
          docker run -d --name apex -p 3000:3000 -e PORT=3000 apex-humanoid:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health; then ok=1; break; fi
            sleep 1
          done
          docker logs apex
          docker rm -f apex
          [ "$ok" = "1" ] || { echo "container never became healthy"; exit 1; }
